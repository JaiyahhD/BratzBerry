
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#e9a0c6">

  <title>BRATZBERRY™ | Bunny Boo Edition</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="stage">

    <div class="phone">

      <div class="screen">

        <!-- Phone Status Bar -->
        <div class="status">
          <span id="clock">9:41</span>
          <span class="island"></span>
          <span>▂▄▆ ♥</span>
        </div>

        <!-- App Screens -->
        <section
          id="view"
          aria-live="polite"
        ></section>

        <!-- Persistent Spotify Player -->
        <div
          id="music-dock"
          class="music-dock"
          hidden
        >
          <div class="music-dock-header">

            <span id="dock-title">
              Boo Beats 🎧
            </span>

            <button
              id="dock-toggle"
              type="button"
              aria-label="Expand or minimize Spotify player"
              aria-expanded="false"
            >
              Expand ♫
            </button>

          </div>

          <div id="dock-player"></div>

        </div>

        <!-- Phone Home Button -->
        <nav class="bottom">
          <button
            id="home"
            aria-label="Go home"
          >
            <span></span>
          </button>
        </nav>

      </div>

    </div>

    <p class="outside">
      BRATZBERRY™ · Bunny Boo Edition · made by Yasmin ♡
    </p>

  </main>

  <!-- Playlist Data -->
  <script src="playlists.js"></script>

  <!-- Phone Functionality -->
  <script src="script.js"></script>

  <!-- Bestie SOS-->
   <script src="bestie-sos.js"></script>

</body>

</html>
