
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#e9a0c6">

  <title>BRATZBERRY™ | Bunny Boo Edition</title>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="stage">

    <!-- BRATZBERRY Phone -->
    <div class="phone">

      <div class="screen">

        <!-- Phone Status Bar -->
        <div class="status">

          <span id="clock">9:41</span>

          <span class="island"></span>

          <span>▂▄▆ ♥</span>

        </div>

        <!-- Dynamic App Content -->
        <section
          id="view"
          aria-live="polite"
        ></section>

        <!-- Phone Navigation -->
        <nav class="bottom">

          <button
            id="home"
            aria-label="Go home"
          >
            <span></span>
          </button>

        </nav>

      </div>

    </div>

    <!-- Phone Footer -->
    <p class="outside">
      BRATZBERRY™ · Bunny Boo Edition · made by Yasmin ♡
    </p>

  </main>

  <!-- Spotify Playlist Data -->
  <script src="playlists.js"></script>

  <!-- Main Phone Functionality -->
  <script src="script.js"></script>

</body>

</html>
